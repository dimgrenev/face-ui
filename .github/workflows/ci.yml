name: Face UI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install React 19 compatibility matrix
        if: matrix.react == 19
        run: pnpm add -D react@19.3.0 react-dom@19.3.0 @types/react@19.3.0 @types/react-dom@19.3.0 --save-exact --ignore-scripts

      - name: Check package
        run: pnpm check

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Check browser behavior and accessibility
        run: pnpm test:browser
